[package]
name = "openhaunt-node-sim"
version.workspace = true
edition.workspace = true

[lib]
name = "openhaunt_node_sim"
path = "src/lib.rs"

[[bin]]
name = "openhaunt-node-sim"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rumqttc = { workspace = true }
mdns-sd = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Only the tests need an HTTP client: they drive this node through the same API a
# console uses, rather than reaching into it, so what they prove is the protocol
# surface rather than the implementation behind it.
reqwest = { workspace = true }
