name: CI

# What `cargo test`, `npm test` and `npm run check` say, on every push and every
# pull request. Both sides are kept at zero warnings, so the build is `-D warnings`
# rather than a step somebody has to read the log of.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cpal is ALSA on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # `cargo test` and not `--workspace`: the desktop shells are members so one
      # lockfile covers them, but building them needs webkit2gtk. The default
      # members are the console.
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - run: npm --prefix frontend ci
      # The vitest half of the evaluator corpus reads the built wasm, and says so
      # loudly rather than passing quietly when it is missing.
      # wasm-pack, which is what the script runs; it fetches the matching
      # wasm-bindgen itself.
      - run: cargo install wasm-pack --locked
      - run: scripts/build-evaluator.sh
      - run: cargo run -p pult-codegen -- generate
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run check

  # ── Other people's files ────────────────────────────────────────────────────
  # The GDTF and MVR readers, against real files rather than the small ones
  # checked in beside them. Everything here is `#[ignore]` in the default suite,
  # because the corpus is not in the repository — it is other people's work under
  # other people's licenses.
  interop-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Keyed on the script, so changing which files the corpus holds fetches
      # again and leaving it alone does not.
      - uses: actions/cache@v4
        with:
          path: testdata/corpus
          key: interop-corpus-${{ hashFiles('scripts/fetch-interop-corpus.sh', '.github/workflows/ci.yml') }}

      # The MVR files are the official examples gdtf.eu publishes
      # (gdtf.eu/blog/mvr-example-files), so they are named here rather than kept in a
      # secret: anybody can fetch the same corpus. Given to this step, which is the one
      # that reads it — it used to be set on the test step, where nothing did.
      - run: scripts/fetch-interop-corpus.sh
        env:
          GDTF_SHARE_USER: ${{ secrets.GDTF_SHARE_USER }}
          GDTF_SHARE_PASSWORD: ${{ secrets.GDTF_SHARE_PASSWORD }}
          PULT_MVR_SAMPLES: >-
            https://www.gdtf.eu/mvr_files/Basic_Festival.mvr
            https://www.gdtf.eu/mvr_files/Capture_Demo.mvr
            https://www.gdtf.eu/mvr_files/Circle_Stage.mvr
            https://www.gdtf.eu/mvr_files/Demoshow_grandMA3.mvr
            https://www.gdtf.eu/mvr_files/Demostage_MVR.mvr
            https://www.gdtf.eu/mvr_files/Key_Arena_Remake_MVR.mvr
            https://www.gdtf.eu/mvr_files/Messy_Patch.mvr
            https://www.gdtf.eu/mvr_files/Midsize_w_GP.mvr
            https://www.gdtf.eu/mvr_files/Simple_Show.mvr
            https://www.gdtf.eu/mvr_files/Template_Stage1.mvr

      # The ignored tests refuse to pass on an empty corpus rather than skipping
      # quietly, so a job whose secrets are not set fails visibly. Without that this
      # is a green tick that checked nothing.
      - run: cargo test --locked -p pult-gdtf -- --ignored

      # An empty corpus still fails here rather than passing quietly: the reader is
      # only as good as the files it has been pointed at.
      - run: cargo test --locked -p pult-mvr -- --ignored
