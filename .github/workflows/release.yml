name: Release

# Tags cut a release. workflow_dispatch builds everything without publishing, so
# the matrix can be exercised before a tag exists to get wrong.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Every build of every product ships the same console, so it is built once and
  # handed to the jobs that need it.
  FRONTEND_ARTIFACT: frontend-build

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      # The workspace is a virtual manifest, so the version lives under
      # [workspace.package] and the action's own Cargo.toml check cannot see it.
      - id: version
        name: Agree on a version
        run: |
          set -euo pipefail
          workspace=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$workspace" ]]; then
              echo "::error::tag v$tag does not match the workspace version $workspace"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$workspace" >> "$GITHUB_OUTPUT"
          fi

      - uses: michaelklishin/rust-build-package-release-action@v1
        with:
          command: extract-changelog
          version: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

  # ── The console, built once ─────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The generated TypeScript is not in the repository — it comes from the
      # schema — so this has to happen before anything is compiled.
      - run: cargo run -p pult-codegen -- generate
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend/build
          retention-days: 1

  # ── The server and the simulator, as plain binaries ─────────────────────────
  binaries:
    needs: [validate, frontend]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add ${{ matrix.target }}

      # The simulator does not serve a console, but the workspace reads the same
      # directory either way and an absent one is a compile error in rust-embed.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend/build

      # A script rather than steps, so the thing that decides what goes into a
      # release archive can be run on a laptop before it is run on a tag.
      - name: Build and archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: scripts/package-binaries.sh

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: archives
          # Loudly, rather than shipping half a release.
          if-no-files-found: error

  # ── The server, as something apt can install ────────────────────────────────
  deb:
    needs: [validate, frontend]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend/build

      - uses: michaelklishin/rust-build-package-release-action@v1
        id: build
        with:
          command: release-linux-deb
          target: ${{ matrix.target }}
          package: pult-backend
          binary-name: pult-backend
          locked: "true"
          pkg-maintainer: "Hannes Rüger <hannes@rueger.events>"
          pkg-description: "the-pult lighting console server"
          pkg-license: "MIT"
          pkg-homepage: "https://github.com/${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: ${{ steps.build.outputs.artifact_path }}
          if-no-files-found: error

  # ── The desktop apps ────────────────────────────────────────────────────────
  desktop:
    needs: [validate, frontend]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the Tauri prerequisites
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Ad-hoc, which satisfies nobody's idea of a trusted developer but does make
      # the bundle internally consistent. Without it Tauri signs the executable and
      # leaves the bundle without a CodeResources, and macOS calls an app it cannot
      # check that way "damaged" — a dead end, where an unsigned-but-whole app can
      # still be opened from the context menu. Set here rather than inline because
      # an empty value on the other platforms would be a signing identity of "".
      - name: Sign the macOS bundles ad-hoc
        if: startsWith(matrix.runner, 'macos')
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      # The console app serves the frontend from inside itself, exactly as the
      # server does — it is the same crate underneath.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend/build

      # No tagName: the release is assembled once at the end, out of everything,
      # rather than by whichever job happens to finish first. The bundles are
      # collected from the action's own output rather than by its
      # uploadWorkflowArtifacts input, which v0 does not have.
      - uses: tauri-apps/tauri-action@v0
        id: console
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/pult-gui
          args: -- --locked

      - name: Collect the console's bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          # `tr` because jq on Windows ends its lines with a carriage return,
          # which `read` leaves on the end of the path and `cp` then looks for.
          jq -r '.[]' <<< '${{ steps.console.outputs.artifactPaths }}' | tr -d '\r' | while read -r path; do
            # Windows reports these as D:\a\..., which the shell's cp does not
            # follow; the same path with forward slashes it does.
            path="${path//\\//}"
            # macOS ships the .app as a directory and a .tar.gz beside it; only
            # the archive survives a trip through an artifact upload intact.
            [ -d "$path" ] && continue
            cp "$path" bundles/
          done
          ls -la bundles

      - uses: actions/upload-artifact@v4
        with:
          name: pult-gui-${{ matrix.target }}
          path: bundles
          if-no-files-found: error

      # The simulator's panel is its own small app. Built here rather than by a
      # beforeBuildCommand, because Tauri runs that from a directory it infers
      # from frontendDist rather than from the config's own.
      - run: npm --prefix tools/openhaunt-node-sim-gui/ui ci
      - run: npm --prefix tools/openhaunt-node-sim-gui/ui run build

      - uses: tauri-apps/tauri-action@v0
        id: sim
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tools/openhaunt-node-sim-gui
          args: -- --locked

      - name: Collect the simulator's bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundles && mkdir -p bundles
          # `tr` because jq on Windows ends its lines with a carriage return,
          # which `read` leaves on the end of the path and `cp` then looks for.
          jq -r '.[]' <<< '${{ steps.sim.outputs.artifactPaths }}' | tr -d '\r' | while read -r path; do
            path="${path//\\//}"
            [ -d "$path" ] && continue
            cp "$path" bundles/
          done
          ls -la bundles

      - uses: actions/upload-artifact@v4
        with:
          name: openhaunt-node-sim-gui-${{ matrix.target }}
          path: bundles
          if-no-files-found: error

  sbom:
    needs: [validate, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FRONTEND_ARTIFACT }}
          path: frontend/build

      # The workspace root is a virtual manifest, so there is no package name to
      # find there — the version it does find comes from [workspace.package].
      - uses: michaelklishin/rust-build-package-release-action@v1
        with:
          command: generate-sbom
          binary-name: pult-backend

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/sbom/
          retention-days: 90

  release:
    needs: [validate, binaries, deb, desktop, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( \
            -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.dmg" \
            -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \
            -o -name "*.spdx.json" -o -name "*.cdx.json" \
          \) -exec cp {} release/ \;
          cp artifacts/release-notes/release_notes.md .
          ls -la release

      - uses: michaelklishin/rust-build-package-release-action@v1
        id: format
        with:
          command: format-release
          version: ${{ needs.validate.outputs.version }}
          artifacts-dir: release

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.format.outputs.body }}
          files: release/*
