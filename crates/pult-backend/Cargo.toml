[package]
name = "pult-backend"
version.workspace = true
edition.workspace = true

[lib]
name = "pult_backend"
path = "src/lib.rs"

[[bin]]
name = "pult-backend"
path = "src/main.rs"

[dependencies]
pult-schema = { path = "../pult-schema" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
mdns-sd = { workspace = true }
sysinfo = { workspace = true }
reqwest = { workspace = true }
rumqttd = { workspace = true }
rumqttc = { workspace = true }
async-stream = { workspace = true }
hostname = "0.4"
clap = { workspace = true }
inventory = { workspace = true }
paste = { workspace = true }
rust-embed = { workspace = true }

[dev-dependencies]
# start_paused for the playback tests: virtual time, so a four-second fade
# finishes in microseconds.
tokio = { workspace = true, features = ["test-util"] }
# The node side of the OpenHaunt protocol, for the end-to-end tests.
openhaunt-sim = { path = "../../tools/openhaunt-sim" }
