[package]
name = "pult-wing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Pure, in the shape `pult-gdtf` and `pult-mvr-xchange` already have: the MA wing
# protocol on paper — the chunk grammar, what each block of bytes means, and the
# control map that names an index — with no USB, no socket, no runtime and no clock.
# Everything here is testable against `testdata/wing-frames.json` with no wing in the
# machine, which is the whole reason the transport is somebody else's problem.
#
# The certificate exchange (container 0x0029) is deliberately absent. It is the onPC
# license dongle, nothing here needs it, and the corpus does not carry it either.
[dependencies]
# For MA's `hardware_configurations.xml`, which is read where it lies rather than
# converted into anything this repository has to carry. Parsing a string is not an OS,
# so the crate stays pure.
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The host's half, for a program that owns a wing rather than reads a capture: one
# claimed interface, two pipes, and the loop that keeps it up. Off by default so the
# protocol stays testable with nothing plugged in.
rusb = { version = "0.9", optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
usb = ["dep:rusb", "dep:anyhow", "dep:tracing"]
