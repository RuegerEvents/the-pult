[workspace]
resolver = "2"
members = [
    "crates/pult-macros",
    "crates/pult-schema",
    "crates/pult-backend",
    "crates/pult-gui",
    "tools/pult-codegen",
    "tools/openhaunt-sim",
    "tools/openhaunt-sim-gui",
]
# The desktop shells are members so that one lockfile covers everything and CI can
# build them with `--locked`, but not default members: a plain `cargo build` or
# `cargo test` should not need webkit2gtk on the machine to compile the console.
default-members = [
    "crates/pult-macros",
    "crates/pult-schema",
    "crates/pult-backend",
    "tools/pult-codegen",
    "tools/openhaunt-sim",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Hannes Rüger <hannes@rueger.events>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "macros"] }

# Types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# TypeScript gen
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl", "serde-json-impl", "indexmap-impl"] }

# Proc macro infra (only in pult-macros)
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async streams / channels
tokio-stream = "0.1"
futures = "0.3"

# Config
toml = "0.8"

# System statistics, for the station view
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# mDNS discovery
mdns-sd = "0.13"

# HTTP client, for talking to OpenHaunt nodes
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"

# MQTT: an embedded broker the leader runs, and a client to talk to it.
# No TLS on either: nodes are on the show's own network, and pulling in a second
# rustls alongside reqwest's buys nothing here.
rumqttd = { version = "0.20", default-features = false }
rumqttc = { version = "0.25", default-features = false }

# async stream macros
async-stream = "0.3"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# The frontend, embedded in the binary. One artifact is the whole console.
rust-embed = { version = "8", features = ["mime-guess"] }

# Desktop shells around the console and the node simulator
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Distributed static registration
inventory = "0.3"
paste = "1"
