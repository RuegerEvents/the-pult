[workspace]
resolver = "2"
members = [
    "crates/pult-macros",
    "crates/pult-audio",
    "crates/pult-render",
    "crates/pult-render-wasm",
    "crates/pult-schema",
    "crates/pult-gdtf",
    "crates/pult-mvr",
    "crates/pult-mvr-xchange",
    "crates/pult-backend",
    "crates/pult-gui",
    "tools/pult-codegen",
    "tools/openhaunt-node-sim",
    "tools/openhaunt-node-sim-gui",
]
# The desktop shells and the browser evaluator are members so that one lockfile covers
# everything and CI can build them with `--locked`, but not default members: a plain
# `cargo build` should not need webkit2gtk on the machine, and should not drag
# `wasm-bindgen` into a native build of the console.
default-members = [
    "crates/pult-macros",
    "crates/pult-audio",
    "crates/pult-render",
    # In, despite being the browser's half: its tests are the corpus that holds the
    # two compilations of the evaluator to each other, and a guard outside the default
    # suite is a guard nobody runs.
    "crates/pult-render-wasm",
    "crates/pult-schema",
    "crates/pult-gdtf",
    "crates/pult-mvr",
    "crates/pult-mvr-xchange",
    "crates/pult-backend",
    "tools/pult-codegen",
    "tools/openhaunt-node-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hannes Rüger <hannes@rueger.events>"]
license = "MIT"
# Read by the console at build time (`env!("CARGO_PKG_REPOSITORY")`) and answered
# over `/api/config`, so the welcome screen's links to the source, the issues and
# the releases are built from one place rather than typed into the frontend.
repository = "https://github.com/RuegerEvents/the-pult"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "macros"] }

# Types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# TypeScript gen
pult-render = { path = "crates/pult-render" }
pult-audio = { path = "crates/pult-audio" }
pult-gdtf = { path = "crates/pult-gdtf" }
pult-mvr = { path = "crates/pult-mvr" }
pult-mvr-xchange = { path = "crates/pult-mvr-xchange" }
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl", "serde-json-impl", "indexmap-impl"] }

# Proc macro infra (only in pult-macros)
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async streams / channels
tokio-stream = "0.1"
futures = "0.3"

# Config
toml = "0.8"

# System statistics, for the station view
# Beyond `system`: the station row carries what the *machine* is doing — its
# interfaces, its disk and its temperature — beside what this console is costing.
# `systemstat` covers the same ground and was not taken: this crate was already
# here for CPU and memory, and a second one would be a second thing to keep
# working on four release targets.
socket2 = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network", "disk", "component"] }

# mDNS discovery
mdns-sd = "0.13"
# The WebSocket *client* half of MVR-xchange. Already in the tree — axum's `ws`
# feature builds on it — so this is a name for something that was compiled anyway.
tokio-tungstenite = "0.29"

# HTTP client, for talking to OpenHaunt nodes
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
sha2 = "0.10"
hex = "0.4"

# Plugin bundles. `deflate` and nothing else: a bundle is a manifest, a component
# and some scripts, and every other codec is another decoder to trust.
zip = { version = "2", default-features = false, features = ["deflate"] }

# GDTF and MVR are both zipped XML. `serialize` for the serde derives the object
# models are written with, `overlapped-lists` because the GDTF geometry tree
# interleaves child kinds and serde's sequence handling has to look past a foreign
# element to keep filling a list.
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }

# MQTT: an embedded broker the leader runs, and a client to talk to it.
# No TLS on either: nodes are on the show's own network, and pulling in a second
# rustls alongside reqwest's buys nothing here.
rumqttd = { version = "0.20", default-features = false }
rumqttc = { version = "0.25", default-features = false }

# async stream macros
async-stream = "0.3"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# The frontend, embedded in the binary. One artifact is the whole console.
rust-embed = { version = "8", features = ["mime-guess"] }

# Desktop shells around the console and the node simulator
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Distributed static registration
inventory = "0.3"
paste = "1"

# The plugin runtime. 48 is the current LTS line (24 → 36 → 48); pinned exact
# because wasmtime majors land monthly and the WASI minor the host links must
# stay ahead of what the guests were built against.
wasmtime = { version = "=48.0.1", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=48.0.1", default-features = false, features = ["p2", "default-send-request"] }

# Watching plugin files for hot reload
notify = "8"

# Content types for plugin assets served off the disk (already in the tree via
# rust-embed's mime-guess feature)
mime_guess = "2"

# Naming HTTP request parts in the plugin runtime's outbound gate (already in
# the tree via axum and reqwest)
http = "1"

# Sound. The device is `cpal` (Apache-2.0) and the decoder `symphonia` (MPL-2.0,
# file-level copyleft, so linking it costs nothing this repository has to answer for
# — the note is in NOTICE). `symphonia`'s codecs are named rather than taken
# wholesale: a console plays a stem or a click track, and every extra decoder is
# another parser reading a file somebody emailed.
cpal = "0.18"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm"] }

# The beat detector's runtime: pure Rust, no C, no ONNX Runtime to install.
# `fft` supplies the STFT operator the mel front end is built out of.
rten = { version = "0.26", features = ["fft"] }
rten-tensor = "0.26"

# The inference runtime, optimised even in a debug build.
#
# Measured before it was written here: the beat detector's own test takes **63 seconds**
# unoptimised and **0.44 seconds** at `--release`, on the same machine and the same
# thirty seconds of audio. That is not a slow debug build, it is a matrix kernel whose
# whole point is SIMD running as scalar Rust — and it is the difference between "detect
# the beats" being a button somebody presses while developing and being one they learn
# not to. Nothing else in the workspace is opted in: this is the one dependency whose
# unoptimised form is unusable rather than merely slower.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
